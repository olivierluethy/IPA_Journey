; App-level PHP configuration.
; The app targets an older PHP version; its bundled Google API client (v2.0)
; emits Deprecated/Warning notices on PHP 8.2. Printing those to the page
; breaks header()/session_start() ("headers already sent"), so send errors to
; the log instead of the response body. Errors are still recorded in the
; Apache/PHP error log (docker compose logs web).
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_NOTICE
